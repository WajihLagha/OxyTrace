name: oxytrace
description: "Application mobile de gestion de l'intubation trachéale."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  sqflite: ^2.3.0
  crypto: ^3.0.3
  dartz: ^0.10.1
  equatable: ^2.0.5
  get_it: ^7.6.4
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^7.2.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
